name: migrate-secrets

# 临时任务：把本仓库 secrets 加密直写进合并后的目标仓库，迁移完成即删除。
# 值只经 Actions 运行内存 -> gh 客户端加密 -> HTTPS 写入目标仓库，不打印到日志。
on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Migrate NodeSeek secrets to glados-auto-checkin
        env:
          GH_TOKEN: ${{ secrets.MIGRATION_PAT }}
          SRC_NS_COOKIE: ${{ secrets.NS_COOKIE }}
          SRC_DEEPFLOOD_COOKIE: ${{ secrets.DEEPFLOOD_COOKIE }}
          SRC_LINUXSB_COOKIE: ${{ secrets.LINUXSB_COOKIE }}
          SRC_LINUXSB_ACCOUNT: ${{ secrets.LINUXSB_ACCOUNT }}
          SRC_NS_RANDOM: ${{ secrets.NS_RANDOM }}
          SRC_WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: |
          set -euo pipefail
          TARGET="Eitan-S-23/glados-auto-checkin"
          set_secret() {
            name="$1"; value="$2"
            if [ -z "$value" ]; then echo "跳过 $name（源值为空）"; return 0; fi
            gh secret set "$name" -R "$TARGET" --body "$value"
            echo "已写入 $name"
          }
          set_secret NS_COOKIE "$SRC_NS_COOKIE"
          set_secret DEEPFLOOD_COOKIE "$SRC_DEEPFLOOD_COOKIE"
          set_secret LINUXSB_COOKIE "$SRC_LINUXSB_COOKIE"
          set_secret LINUXSB_ACCOUNT "$SRC_LINUXSB_ACCOUNT"
          set_secret NS_RANDOM "$SRC_NS_RANDOM"
          set_secret WECOM_WEBHOOK "$SRC_WECOM_WEBHOOK"
